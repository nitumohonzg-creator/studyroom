<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyRoom Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div class="auth-container" id="authBox">
    <div id="loginForm">
      <h2 style="text-align: center;">StudyRoom Pro 📚</h2>
      <div class="input-group" style="margin-top: 20px;">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>
      <button class="btn" onclick="loginUser()">Login</button>
      <div class="toggle-text">Don't have an account? <span onclick="toggleAuth('signup')">Sign Up</span></div>
    </div>

    <div id="signupForm" style="display: none;">
      <h2 style="text-align: center;">Create Account</h2>
      <div class="input-group" style="margin-top: 20px;">
        <label>Display Name</label>
        <input type="text" id="signupName" placeholder="E.g., ExamWarrior">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password">
      </div>
      <button class="btn" onclick="signupUser()">Sign Up</button>
      <div class="toggle-text">Already have an account? <span onclick="toggleAuth('login')">Login</span></div>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div class="auth-container" id="dashboardScreen" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="welcomeText" style="margin: 0; color: var(--primary-btn); font-size: 20px;">Welcome!</h2>
      <div style="display: flex; gap: 8px;">
        <button class="btn" style="width: auto; padding: 6px 10px; background-color: #6c757d;" onclick="toggleDarkMode()">🌙</button>
        <button class="btn" style="width: auto; padding: 6px 10px; background-color: #dc3545;" onclick="logoutUser()">Logout</button>
      </div>
    </div>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap;">
      <button class="btn" style="width: auto;" onclick="openCreateRoom()">➕ Create Room</button>
      <button class="btn" style="width: auto; background-color: #28a745;" onclick="openJoinRoom()">🤝 Join Room</button>
    </div>

    <div id="createRoomBox" style="display: none; padding: 15px; border: 1px dashed var(--primary-btn); margin-top: 20px; border-radius: 8px;">
      <input type="text" id="newRoomName" placeholder="Room Name (e.g. ADRE Target)">
      <button class="btn" onclick="saveRoomToFirebase()">Save</button>
    </div>

    <div id="joinRoomBox" style="display: none; padding: 15px; border: 1px dashed #28a745; margin-top: 20px; border-radius: 8px;">
      <input type="text" id="joinRoomIdInput" placeholder="Paste Room ID here">
      <button class="btn" style="background-color: #28a745;" onclick="joinRoomByFirebase()">Join</button>
    </div>

    <div style="margin-top: 20px;">
      <h3>My Rooms</h3>
      <div id="roomsListContainer" style="margin-top: 10px;">Loading rooms...</div>
    </div>
  </div>

  <!-- ROOM VIEW SCREEN -->
  <div class="auth-container" id="roomViewScreen" style="display: none; position: relative;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--border-color);">
      <h2 id="roomTitleText" style="margin: 0; color: var(--primary-btn); font-size: 20px;">Room</h2>
      <button class="btn" style="width: auto; padding: 6px 12px; background-color: #6c757d;" onclick="backToDashboard()">⬅️ Back</button>
    </div>
    
    <!-- ROOM CONTROLS (DIRECT SHARE ADDED) -->
    <div style="display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;">
      <button class="btn" style="width: auto; padding: 8px 12px; background-color: #28a745;" onclick="shareInviteLink()">🔗 Share Invite Link</button>
      <button class="btn" style="width: auto; padding: 8px 12px; background-color: #17a2b8;" onclick="copyRoomId()">📋 Copy ID</button>
      <button class="btn" style="width: auto; padding: 8px 12px; background-color: #dc3545;" onclick="leaveRoom()">🚪 Leave</button>
    </div>

    <!-- SEARCH BAR ADDED -->
    <div class="input-group">
      <input type="text" id="searchQuestion" placeholder="🔍 Search questions or topics..." onkeyup="filterQuestions()">
    </div>

    <div id="addMcqBtnContainer" style="text-align: center; margin-bottom: 20px;">
      <button class="btn" style="width: auto; padding: 10px 20px;" onclick="openAddQuestionBox()">➕ Add MCQ</button>
    </div>

    <!-- ADD QUESTION FORM (TOPIC ADDED) -->
    <div id="addQuestionBox" style="display: none; padding: 15px; border: 1px solid var(--primary-btn); border-radius: 8px; margin-bottom: 20px;">
      <h4>New Question</h4>
      <input type="text" id="queTopic" placeholder="Topic/Subject (e.g. History)" style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="queText" placeholder="Question..." style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="optA" placeholder="Option A" style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="optB" placeholder="Option B" style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="optC" placeholder="Option C" style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="optD" placeholder="Option D" style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <input type="text" id="correctOpt" placeholder="Correct Answer (A/B/C/D)" style="width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color);">
      <button class="btn" onclick="saveQuestionToFirebase()">Save Question</button>
      <button class="btn" style="background: #6c757d;" onclick="closeAddQuestionBox()">Cancel</button>
    </div>

    <div>
      <h3>Questions Board</h3>
      <div id="questionsListContainer" style="margin-top: 10px;">Loading...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="script.js"></script>
</body>
</html>
