<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyRoom Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login/Signup... (Wahi purana authBox) -->
  <div class="auth-container" id="authBox">
    <div id="loginForm">
      <h2>Welcome Back!</h2>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button class="btn" onclick="loginUser()">Login</button>
    </div>
    <div id="signupForm" style="display: none;">
      <h2>Create Account</h2>
      <input type="text" id="signupName" placeholder="Display Name">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password">
      <button class="btn" onclick="signupUser()">Sign Up</button>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div class="auth-container" id="dashboardScreen" style="display: none; max-width: 600px; padding: 20px;">
    <h2 id="welcomeText">Welcome!</h2>
    <button class="btn" onclick="logoutUser()">Logout</button>
    
    <div id="roomsListContainer"></div>
    <button class="btn" onclick="openCreateRoom()">➕ Create Room</button>
    <div id="createRoomBox" style="display:none;">
      <input type="text" id="newRoomName" placeholder="Room Name">
      <button class="btn" onclick="saveRoomToFirebase()">Save</button>
    </div>
  </div>

  <!-- ROOM VIEW SCREEN -->
  <div class="auth-container" id="roomViewScreen" style="display: none; max-width: 600px; padding: 20px;">
    <h2 id="roomTitleText">Room Name</h2>
    <button class="btn" onclick="backToDashboard()">⬅️ Back</button>
    
    <!-- Members List Area -->
    <div id="membersContainer" style="background:#eee; padding:10px; margin:10px 0;">
      <h4>Members</h4>
      <div id="membersList"></div>
    </div>

    <div id="questionsListContainer"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="script.js"></script>
</body>
</html>
