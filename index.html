<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyRoom - Dashboard</title>
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTHENTICATION SCREEN (Login/Signup) -->
  <div class="auth-container" id="authBox">
    
    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h2>Welcome Back!</h2>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
      </div>
      <button class="btn" onclick="loginUser()">Login</button>
      <div class="toggle-text">
        Don't have an account? <span onclick="toggleAuth('signup')">Sign Up</span>
      </div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display: none;">
      <h2>Create Account</h2>
      <div class="input-group">
        <label>Display Name</label>
        <input type="text" id="signupName" placeholder="E.g., ExamWarrior">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password">
      </div>
      <button class="btn" onclick="signupUser()">Sign Up</button>
      <div class="toggle-text">
        Already have an account? <span onclick="toggleAuth('login')">Login</span>
      </div>
    </div>

  </div>

  <!-- DASHBOARD SCREEN (Login hone ke baad dikhega) -->
  <div class="auth-container" id="dashboardScreen" style="display: none; max-width: 600px; padding: 20px;">
    
    <!-- Dashboard Header (Name + Logout) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 id="welcomeText" style="margin: 0; color: #1a73e8; font-size: 22px;">Welcome, User!</h2>
      <button class="btn" style="width: auto; padding: 6px 12px; background-color: #dc3545; margin-top: 0; font-size: 14px;" onclick="logoutUser()">Logout</button>
    </div>
    
    <!-- Room Actions -->
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ccc; text-align: center;">
      <h3 style="margin-top: 0; color: #333;">Group Study Rooms</h3>
      <p style="color: #666; font-size: 14px;">Naya room banayein ya dosto ke room me judey.</p>
      
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap;">
        <button class="btn" style="width: auto;" onclick="openCreateRoom()">➕ Create Room</button>
        <button class="btn" style="width: auto; background-color: #28a745;" onclick="alert('Join room aage banayenge!')">🤝 Join Room</button>
      </div>
    </div>

    <!-- MY ROOMS LIST (Naya Feature) -->
    <div style="margin-top: 20px;">
      <h3 style="color: #333; margin-bottom: 10px;">My Rooms</h3>
      <div id="roomsListContainer">
        <!-- Firebase se aane wale rooms yahan dikhenge -->
        <p style="color: #888; font-size: 14px;">Loading rooms...</p>
      </div>
    </div>

    <!-- CREATE ROOM FORM (Chhupa hua dabba) -->
    <div id="createRoomBox" style="display: none; background: white; padding: 20px; border-radius: 8px; border: 1px solid #1a73e8; margin-top: 20px;">
      <h3 style="margin-top:0; color: #1a73e8;">Create a New Room</h3>
      <div class="input-group">
        <label>Room Name</label>
        <input type="text" id="newRoomName" placeholder="E.g., Assam Police Target 2026">
      </div>
      <button class="btn" onclick="saveRoomToFirebase()">Save Room</button>
      <button class="btn" style="background: #666; margin-top: 10px;" onclick="closeCreateRoom()">Cancel</button>
    </div>

  </div>

  <!-- Google Firebase SDKs (Version 8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- JavaScript Link -->
  <script src="script.js"></script>

</body>
</html>
