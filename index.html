<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parakh - MCQ Study Room</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- LOGIN / SIGNUP SCREEN -->
    <div id="auth-screen" class="screen">
        <h2>Welcome to Parakh 📚</h2>
        <input type="email" id="email" placeholder="Email daalein">
        <input type="password" id="password" placeholder="Password daalein">
        <button onclick="loginUser()">Login</button>
        <button onclick="signupUser()">Sign Up</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <!-- DASHBOARD SCREEN (Rooms list) -->
    <div id="dashboard-screen" class="screen" style="display: none;">
        <h2>Dashboard 🏠</h2>
        <p>Email: <span id="user-email"></span></p>
        <button onclick="logoutUser()" style="background: red;">Logout</button>
        
        <hr>
        <h3>Study Rooms</h3>
        <input type="text" id="room-name" placeholder="Naya Room ka naam">
        <button onclick="createRoom()">Create Room</button>
        
        <div id="rooms-list">
            <!-- Rooms yahan dikhenge -->
        </div>
    </div>

    <!-- ROOM SCREEN (MCQs) -->
    <div id="room-screen" class="screen" style="display: none;">
        <!-- Mobile back button jaisa kaam karega yeh -->
        <button onclick="goBackToDashboard()" style="background: #6c757d;">⬅ Back to Dashboard</button>
        <h2 id="current-room-name">Room Name</h2>
        
        <!-- Manual MCQ Add Box -->
        <div class="add-mcq-box">
            <h4>Add 1 Question 📝</h4>
            <input type="text" id="question" placeholder="Question type karein...">
            <input type="text" id="option1" placeholder="Option 1">
            <input type="text" id="option2" placeholder="Option 2">
            <input type="text" id="correct-ans" placeholder="Correct Answer (1 ya 2)">
            <button onclick="addMCQ()">Add MCQ</button>
        </div>

        <!-- CSV Bulk Upload Box -->
        <div class="add-mcq-box" style="background: #e8f5e9; margin-top: 10px;">
            <h4>Bulk Upload (CSV File) 📁</h4>
            <p style="font-size: 12px; margin: 0 0 10px 0;">Format: Question, Option1, Option2, Answer<br><i>(Note: Question ya options ke beech mein koi comma ',' mat lagana file banate waqt)</i></p>
            <input type="file" id="csv-file" accept=".csv">
            <button onclick="uploadCSV()" style="background-color: #ff9800;">Upload 100+ Questions</button>
        </div>

        <h3>Room Questions:</h3>
        <div id="mcq-list">
            <!-- MCQs yahan dikhenge -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
